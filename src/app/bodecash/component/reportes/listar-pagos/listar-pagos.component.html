<div class="container">
  <div class="card">
    <h2>Lista de Pagos</h2>
    <table mat-table [dataSource]="pagos" class="mat-elevation-z8">
      <ng-container matColumnDef="idPago">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let pago"> {{ pago.idPago }} </td>
      </ng-container>

      <ng-container matColumnDef="monto">
        <th mat-header-cell *matHeaderCellDef> Monto </th>
        <td mat-cell *matCellDef="let pago"> {{ pago.monto }} </td>
      </ng-container>

      <ng-container matColumnDef="fechaPago">
        <th mat-header-cell *matHeaderCellDef> Fecha de Pago </th>
        <td mat-cell *matCellDef="let pago"> {{ pago.fechaPago }} </td>
      </ng-container>

      <ng-container matColumnDef="tipoPago">
        <th mat-header-cell *matHeaderCellDef> Tipo de Pago </th>
        <td mat-cell *matCellDef="let pago"> {{ pago.tipoPago }} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let pago"> {{ pago.estado ? 'Pagado' : 'Pagado' }} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let pago">
          <button mat-icon-button color="primary" [routerLink]="['/crear-actualizar-pago', pago.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarPago(pago.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>

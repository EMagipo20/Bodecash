<div class="container">
  <div class="card">
    <form [formGroup]="pagoForm" (ngSubmit)="registrarPago()" class="form">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Detalle Crédito</mat-label>
        <mat-select id="idDetalleCredito" formControlName="idDetalleCredito" (selectionChange)="onDetalleCreditoChange($event)">
          <mat-option *ngFor="let detalle of detallesCredito" [value]="detalle.idDetalleCredito">{{detalle.idDetalleCredito}} - {{detalle.renta}}</mat-option>
        </mat-select>
      </mat-form-field>
      
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Monto</mat-label>
        <input matInput id="monto" formControlName="monto" type="number" [value]="selectedMonto">
      </mat-form-field>
      
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Fecha de Pago</mat-label>
        <input matInput [matDatepicker]="picker" id="fechaPago" formControlName="fechaPago">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Tipo de Pago</mat-label>
        <mat-select id="tipoPago" formControlName="tipoPago">
          <mat-option *ngFor="let tipo of tiposPago" [value]="tipo">{{tipo}}</mat-option>
        </mat-select>
      </mat-form-field>
      
      <mat-checkbox formControlName="estado" class="form-field">
        Pagado
      </mat-checkbox>
      
      <button mat-raised-button color="primary" type="submit">Guardar</button>
    </form>
  </div>
</div>

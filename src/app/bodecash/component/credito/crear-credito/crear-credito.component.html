<div class="container">
  <div class="card">
    <h2>Registrar Crédito</h2>
    <form (ngSubmit)="onSubmit()" class="form">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Monto:</mat-label>
        <input matInput type="number" id="monto" [(ngModel)]="credito.monto" name="monto" required readonly>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Fecha Inicio:</mat-label>
        <input matInput [matDatepicker]="picker1" formControlName="fechaInicio">
        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Fecha Fin:</mat-label>
        <input matInput [matDatepicker]="picker2" formControlName="fechaFin">
        <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Tipo de Crédito:</mat-label>
        <mat-select id="tipoCredito" [(ngModel)]="credito.tipoCredito" name="tipoCredito" required>
          <mat-option *ngFor="let tipo of tiposCredito" [value]="tipo">{{tipo}}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Tipo de Interés:</mat-label>
        <mat-select id="tipoInteres" [(ngModel)]="credito.tipoInteres" name="tipoInteres" required>
          <mat-option *ngFor="let tipo of tiposInteres" [value]="tipo">{{tipo}}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Plazo de Gracia:</mat-label>
        <mat-select id="plazoGracia" [(ngModel)]="credito.plazoGracia" name="plazoGracia" required>
          <mat-option *ngFor="let plazo of plazosGracia" [value]="plazo">{{plazo}}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Número de Días por Cuota:</mat-label>
        <mat-select id="numeroDiasCuota" [(ngModel)]="credito.numeroDiasCuota" name="numeroDiasCuota" required>
          <mat-option *ngFor="let dias of diasCuota" [value]="dias">{{dias}}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Cliente:</mat-label>
        <mat-select id="cliente" (selectionChange)="onClienteChange($event.value)" [(ngModel)]="credito.idCliente" name="cliente" required>
          <mat-option *ngFor="let cliente of clientes" [value]="cliente.id">{{cliente.nombre}}</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit"><mat-icon>save</mat-icon>Registrar</button>
    </form>
  </div>
</div>
